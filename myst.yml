version: 1

# Branding
extends:
  # choose between c3s.yml, cams.yml, and ecmwf.yml
  - branding/c3s.yml

project:
  title: ECMWF Training Template
  license: Apache-2.0
  open_access: true
  exclude:
    - developer/*
  github: ecmwf-training/jupyter-template
  thebe:
    binder:
      repo: ecmwf-training/jupyter-template
      provider: github
      url: https://mybinder.org
      ref: develop
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    # - file: intro.md
    - title: README instructions
      file: README.md
    - file: jupyter-notebook-template
      title: Jupyter Notebook Template
    - file: viewer-for-sealevel-product
      title: Viewer for sealevel product
    - file: viewer-for-sea-ice-concentration
      title: Viewer for sea ice concentration
    - file: ocean-colour-sea-surface-temperature
      title: Ocean colour and sea surface temperature
    - file: sea-surface-ice-surface-temperature
      title: Sea surface and ice surface temperature
    - file: sea-ice-thickness-datasets-changes-trends
      title: Sea ice thickness - Datasets, changes and trends
    - file: satellite-ist-sst-polar
site:
  template: book-theme
  options:
    folders: true
